[package]
name = "md-lite"
version = "0.4.0"
description = "A lightweight, native Markdown reader and editor for Linux"
authors = ["MD Lite contributors"]
license = "MIT"
repository = "https://github.com/glozahn/md-lite"
edition = "2021"
rust-version = "1.82"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_6"] }
webkit6 = "0.6"
soup3 = "0.9"
pangocairo = "0.22"
glib = "0.22"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
regex = "1"
fancy-regex = "0.19"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lzma-rs = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
